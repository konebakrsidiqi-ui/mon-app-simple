name: Build Android APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lldb lld zlib1g-dev zip unzip autoconf libtool pkg-config openjdk-17-jdk

    - name: Install Stable Python Dependencies
      run: |
        pip install --upgrade pip
        pip install cython virtualenv
        # On installe la dernière version stable officielle de Buildozer (pas la branche master)
        pip install buildozer==1.5.0

    - name: Configure SDK Tools and Accept Licenses
      run: |
        # On configure Buildozer pour qu'il télécharge une version stable des outils Android
        # en modifiant directement le fichier de configuration avant la compilation
        sed -i 's/#android.api = 31/android.api = 34/' buildozer.spec
        sed -i 's/#android.build_tools_version = .*/android.build_tools_version = 34.0.0/' buildozer.spec
        
        # On force l'acceptation globale des licences via l'environnement de Buildozer
        mkdir -p ~/.buildozer
        echo "[buildozer]" > ~/.buildozer/config
        echo "warn_on_root = 1" >> ~/.buildozer/config

    - name: Build with Buildozer
      run: |
        # L'option --verbose permet de voir précisément chaque étape en cas de besoin
        buildozer --verbose android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "y"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-debug
        path: bin/*.apk
